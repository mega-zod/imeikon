<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMEI Check</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#101828}.wrap{max-width:760px;margin:0 auto;padding:72px 20px}.brand{font-weight:800;font-size:20px;letter-spacing:-.03em}.hero{margin-top:70px}.eyebrow{font-size:13px;font-weight:700;color:#667085;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:48px;line-height:1.05;margin:12px 0 14px;letter-spacing:-.05em}.hero p{color:#667085;font-size:17px}.card{margin-top:32px;background:white;border:1px solid #e4e7ec;border-radius:20px;padding:24px;box-shadow:0 12px 35px #1018280d}.row{display:flex;gap:10px}.input{flex:1;border:1px solid #d0d5dd;border-radius:12px;padding:15px;font-size:16px;outline:none}.input:focus{border-color:#667085;box-shadow:0 0 0 4px #98a2b324}.btn{border:0;border-radius:12px;padding:0 22px;font-weight:700;background:#111827;color:#fff;cursor:pointer}.btn:disabled{opacity:.5}.hint{font-size:12px;color:#98a2b3;margin-top:10px}.result{display:none;margin-top:24px;border-top:1px solid #eaecf0;padding-top:24px}.status{display:inline-flex;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#ecfdf3;color:#027a48}.status.bad{background:#fef3f2;color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.item{background:#f8fafc;border-radius:12px;padding:14px}.label{font-size:11px;color:#667085;text-transform:uppercase;letter-spacing:.08em}.value{font-weight:700;margin-top:5px;word-break:break-word}.error{display:none;margin-top:14px;color:#b42318;background:#fef3f2;border-radius:12px;padding:12px;font-size:14px}@media(max-width:600px){.hero h1{font-size:38px}.row{flex-direction:column}.btn{height:50px}.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><div class="brand">IMEI Check</div><section class="hero"><div class="eyebrow">Device verification</div><h1>Check an IMEI.</h1><p>Enter a 15-digit IMEI to retrieve the information available through your IMEI.info API plan.</p></section>
<div class="card"><div class="row"><input id="imei" class="input" inputmode="numeric" maxlength="15" placeholder="Enter 15-digit IMEI" autocomplete="off"><button id="check" class="btn">Check IMEI</button></div><div class="hint">Your API key stays on the server and is never sent to the browser.</div><div id="error" class="error"></div><div id="result" class="result"><div id="status" class="status">CLEAN</div><div class="grid"><div class="item"><div class="label">Brand</div><div id="brand" class="value">—</div></div><div class="item"><div class="label">Model</div><div id="model" class="value">—</div></div><div class="item"><div class="label">Carrier lock</div><div id="lock" class="value">—</div></div><div class="item"><div class="label">Purchase country</div><div id="country" class="value">—</div></div><div class="item"><div class="label">Original carrier</div><div id="carrier" class="value">—</div></div><div class="item"><div class="label">IMEI</div><div id="imeiOut" class="value">—</div></div></div></div></div></main>
<script>
const $=id=>document.getElementById(id);const input=$('imei');const btn=$('check');
function showError(x){$('error').textContent=x;$('error').style.display='block'}
function val(x){return x===null||x===undefined||x===''?'—':String(x)}
async function check(){const imei=input.value.replace(/\D/g,'');input.value=imei;$('error').style.display='none';$('result').style.display='none';btn.disabled=true;btn.textContent='Checking…';try{const r=await fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imei})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Check failed');$('brand').textContent=val(d.brand);$('model').textContent=val(d.model);$('lock').textContent=d.carrierLock===null?'—':(d.carrierLock?'LOCKED':'UNLOCKED');$('country').textContent=val(d.purchaseCountry);$('carrier').textContent=val(d.originalCarrier);$('imeiOut').textContent=d.imei;const s=$('status');s.textContent=val(d.blacklistStatus);s.className='status'+(String(d.blacklistStatus).toUpperCase()==='BLACKLISTED'?' bad':'');$('result').style.display='block'}catch(e){showError(e.message)}finally{btn.disabled=false;btn.textContent='Check IMEI'}}
btn.onclick=check;input.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
</script></body></html>
